
version: "3.1"

rules:
- rule: Greet user
  steps:
  - intent: greet
  - action: action_greet_last_user  # Изменено на новое действие
- rule: Say goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye
- rule: Provide help
  steps:
  - intent: help
  - action: utter_help
- rule: Echo command processing
  steps:
  - intent: echo
  - action: action_echo
- rule: Weather temperature
  steps:
  - intent: ask_weather
  - action: action_get_weather
- rule: Analyze text
  steps:
  - intent: analyze_text
  - action: action_analyze_text
- rule: Save user info
  steps:
  - intent: provide_user_info
  - action: action_save_user_info